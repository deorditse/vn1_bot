[default]
API_MODE = "PROD"
API_PORT = 8022

GITLAB_SEARCH_PER_PROJECT_LIMIT = 10
GITLAB_QUERY_PLANNER_PROVIDER = "openai"
GITLAB_QUERY_PLANNER_MODEL = "gpt-4o-mini"
GITLAB_REPOSITORY_SELECTOR_MODEL = "gpt-4o-mini"
GITLAB_QUERY_PLANNER_BASE_URL = "https://api.openai.com/v1"
GITLAB_QUERY_PLANNER_TOKEN_ENV = "OPENAI_API_KEY"
GITLAB_QUERY_PLANNER_MAX_QUERIES = 6
GITLAB_QUERY_PLANNER_MIN_WORDS = 3
GITLAB_ANSWER_USE_LLM = true
GITLAB_ANSWER_MAX_SOURCES = 15
GITLAB_ANSWER_MAX_DESCRIPTION_CHARS = 120
GITLAB_SKILL_MOCK_ENABLED = false

[[default.GITLAB_REPOSITORIES]]
id = "flutter_mobile_vn1"
base_url = "https://gitlab.avgr.su"
project_path = "amiga/flutter_mobile_vn1"
description = "VN1 mobile frontend repository. Use it for frontend, mobile application, mobile app, МП, мобильное приложение, мобилка, фронт, Flutter, UI, screen, page, widget, button, cart, and auth in the mobile app."
token_env = "GITLAB_AVGR_TOKEN"
enabled = true
ignore_path_patterns = [
  "packages/app/lib/generated/**",
  "packages/app/lib/l10n/**",
  "**/generated/**",
  "**/l10n/**",
  "**/*.freezed.dart",
  "**/*.g.dart",
  "**/*.gr.dart",
  "**/*.gen.dart",
  "**/*.arb",
]

[[default.GITLAB_REPOSITORIES]]
id = "backend_vn1"
base_url = "https://gitlab.avgr.su"
project_path = "amiga/vn1"
description = "VN1 backend repository. Use it for backend, server-side logic, API, Bitrix, PHP, database, import/export, catalog backend, and auth backend."
token_env = "GITLAB_AVGR_TOKEN"
enabled = true
ignore_path_patterns = [
  "vendor/**",
  "node_modules/**",
  "upload/**",
  "bitrix/cache/**",
  "bitrix/managed_cache/**",
]

